[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "poligon"
version = "1.4.1"
description = "CTF practice simulator for digital forensics training and competition prep. by ShadowStrike."
readme = "README.md"
license = {text = "MIT"}
authors = [
  {name = "ShadowStrike"},
]
requires-python = ">=3.11"
dependencies = [
    "pillow",
    "faker",
    "fastapi",
    "uvicorn",
    "pydantic>=2.4",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.scripts]
poligon = "poligon.cli:main"
poligon-web = "poligon.web.main:main"

[project.optional-dependencies]
test = ["pytest", "httpx2", "hypothesis"]

[project.urls]
"Source" = "https://github.com/ShadowStrike-CTF/poligon"

[tool.hatch.build.targets.wheel]
packages = ["src/poligon"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["slow: property-based fuzzing (hypothesis)"]
