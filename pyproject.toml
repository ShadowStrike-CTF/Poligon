[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "poligon"
version = "1.0.1"
description = "CTF practice simulator for digital forensics training and competition prep. by ShadowStrike."
readme = "README.md"
license = {text = "Proprietary"}
authors = [
    {name = "Strategos", email = "r@strategos.au"}
]
requires-python = ">=3.11"
dependencies = [
    "pillow",
    "faker",
    "fastapi",
    "uvicorn",
]
classifiers = [
    "Development Status :: 1 - Planning",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
]

[project.scripts]
poligon = "poligon.cli:main"
poligon-web = "poligon.web.main:main"

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[project.urls]
"Source" = "https://github.com/ShadowStrike-CTF/poligon"

[tool.hatch.build.targets.wheel]
packages = ["src/poligon"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
